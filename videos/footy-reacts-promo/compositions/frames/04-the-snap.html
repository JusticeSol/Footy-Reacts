  <script>
    (function () {
      var FRAME = "04-the-snap";
      var root = document.querySelector('[data-composition-id="04-the-snap"]');
      if (!root) return;

      var tl = gsap.timeline({ paused: true });

      /* ------------------------------------------------------------------
         SCENE 1 (0.0-0.9s) - THE SNAP.
         dynamic-content-sequencing: the row content array is reduced ONCE at
         build time into a flat TIMELINE of absolute start/end times. No
         hardcoded per-row offsets, nothing recomputed inside onUpdate.
         ------------------------------------------------------------------ */
      var SNAP_START = 0.0;
      var ROW_GAP = 0.06;        /* ~60ms - the tight stagger the sketch calls for */
      var BASE_DURATION = 0.42;
      var SEC_PER_CHAR = 0.006;

      var ROWS = [
        { home: "FUL", score: "1 - 1", away: "MUN" },
        { home: "BOU", score: "0 - 1", away: "LIV" },
        { home: "LEE", score: "0 - 0", away: "CRY" },
        { home: "MCI", score: "5 - 3", away: "SUN" },
        { home: "BHA", score: "3 - 0", away: "ARS" },
        { home: "EVE", score: "1 - 0", away: "IPS" }
      ];

      var cumulative = SNAP_START;
      var TIMELINE = ROWS.map(function (entry) {
        var chars = (entry.home + entry.score + entry.away).length;
        var dur = BASE_DURATION + chars * SEC_PER_CHAR;
        var start = cumulative;
        cumulative += ROW_GAP;
        return { start: start, end: start + dur, duration: dur };
      });

      /* Two depth layers: every row arrives on the FAR plane it wore in frame 02
         (dim, blurred, undersized) and resolves onto the NEAR plane - the same
         objects, suddenly legible. Short path straight into its own slot. */
      var FAR = { y: -34, scale: 0.94, opacity: 0.3, filter: "blur(4px)" };

      var rowEls = root.querySelectorAll(".f-04-the-snap-row");

      TIMELINE.forEach(function (slot, i) {
        var el = rowEls[i];
        if (!el) return;
        tl.fromTo(
          el,
          { y: FAR.y, scale: FAR.scale, opacity: FAR.opacity, filter: FAR.filter },
          {
            y: 0,
            scale: 1,
            opacity: 1,
            filter: "blur(0px)",
            duration: slot.duration,
            ease: "power3.out"
          },
          slot.start
        );
      });

      /* ------------------------------------------------------------------
         SCENE 2 (0.9-2.6s) - svg-path-draw: the coral leftbar draws DOWN the
         FUL 1 - 1 MUN row, marking the fixture frame 06 opens. Single accent.
         The dash pattern comes from the measured path length, never a guess.
         ------------------------------------------------------------------ */
      var BAR_DRAW_START = 0.9;
      var BAR_DRAW_DUR = 0.62;

      var bar = root.querySelector("#f-04-the-snap-bar");
      if (bar) {
        var BAR_LEN = 117.72; /* geometric fallback if the path is not measurable yet */
        try {
          var measured = bar.getTotalLength();
          if (measured > 0) BAR_LEN = measured;
        } catch (e) {}

        bar.style.strokeDasharray = String(BAR_LEN);
        bar.style.strokeDashoffset = String(BAR_LEN);

        tl.fromTo(
          bar,
          { strokeDashoffset: BAR_LEN },
          { strokeDashoffset: 0, duration: BAR_DRAW_DUR, ease: "power2.out" },
          BAR_DRAW_START
        );
      }

      /* ------------------------------------------------------------------
         SCENE 3 (2.6-8.0s) - HELD READ, FULLY STILL.
         The long hold is the point: the audience needs time to register that
         the noise became a list. No drift, no float, no push-in, no hover.
         An empty tween carries the timeline to the full 8s and moves nothing.
         ------------------------------------------------------------------ */
      tl.to({}, { duration: 8 }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME] = tl;
      tl.seek(0);
    })();
