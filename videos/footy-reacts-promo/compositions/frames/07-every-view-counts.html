  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });

      /* ------------------------------------------------------------------
         Scene 2 (1.2–4.0s) — discrete-text-sequence.
         Sparse {t, text} states per fixed line; a reverse search on every
         onUpdate renders the latest state whose t has passed. Lines are
         pre-broken so nothing ever reflows (the multi-line analogue of the
         rule's mandatory min-width).
      ------------------------------------------------------------------ */
      var SEQ1 = [
        [1.20, ""],
        [1.28, "IT"],
        [1.40, "IT NEV"],
        [1.52, "IT NEVER"],
        [1.70, "IT NEVER RE-"],
        [1.84, "IT NEVER RE-HOSTS"],
        [1.96, "IT NEVER RE-HOSTS."]
      ];
      var SEQ2 = [
        [2.18, "EVERY"],
        [2.34, "EVERY VIEW"],
        [2.52, "EVERY VIEW COUNTS"],
        [2.70, "EVERY VIEW COUNTS ON"],
        [2.86, "EVERY VIEW COUNTS ON THE"]
      ];
      /* the coral phrase arrives on its own cue */
      var SEQ3 = [
        [3.10, "CREATOR'S"],
        [3.26, "CREATOR'S OWN"],
        [3.44, "CREATOR'S OWN CHANNEL"],
        [3.56, "CREATOR'S OWN CHANNEL."]
      ];
      /* Scene 3 — the URL builds in Space Mono 700 */
      var SEQU = [
        [5.10, "footy-reacts"],
        [5.34, "footy-reacts.vercel"],
        [5.58, "footy-reacts.vercel.app"]
      ];

      function stateAt(seq, t) {
        for (var i = seq.length - 1; i >= 0; i--) {
          if (t >= seq[i][0]) return seq[i][1];
        }
        return "";
      }

      var l1 = document.getElementById("f07-l1");
      var l2 = document.getElementById("f07-l2");
      var l3 = document.getElementById("f07-l3");
      var ut = document.getElementById("f07-urltx");
      var c1 = document.getElementById("f07-c1");
      var c2 = document.getElementById("f07-c2");
      var c3 = document.getElementById("f07-c3");

      /* cursor lives on whichever line is currently being typed, and retires
         for good once the claim is complete — the hold carries no blink */
      var CUR = [
        [c1, 1.20, 2.12],
        [c2, 2.12, 3.04],
        [c3, 3.04, 3.70]
      ];
      var BLINK_PERIOD = 0.55;

      var driver = { t: 0 };
      tl.to(driver, {
        t: 9,
        duration: 9,
        ease: "none",
        onUpdate: function () {
          var t = driver.t;
          l1.textContent = stateAt(SEQ1, t);
          l2.textContent = stateAt(SEQ2, t);
          l3.textContent = stateAt(SEQ3, t);
          ut.textContent = stateAt(SEQU, t);
          /* deterministic square wave — never a CSS animation */
          var on = Math.sin((t / BLINK_PERIOD) * Math.PI * 2) > -0.35 ? 1 : 0;
          for (var i = 0; i < CUR.length; i++) {
            var c = CUR[i];
            c[0].style.opacity = (t >= c[1] && t < c[2]) ? String(on) : "0";
          }
        }
      }, 0);

      /* coral phrase lands — a single state pulse, no repeat/yoyo */
      tl.fromTo("#f07-line3",
        { scale: 1 },
        { scale: 1.030, duration: 0.12, ease: "power2.out" }, 3.56);
      tl.to("#f07-line3",
        { scale: 1, duration: 0.20, ease: "power2.inOut" }, 3.68);

      /* ------------------------------------------------------------------
         Scene 3 (4.0–6.2s) — the claim CLEARS first (read, then vacated),
         shrink-toward-centre + 10px text-scale blur, opacity on its own
         linear tween so the dimming is even.
      ------------------------------------------------------------------ */
      /* Explicit resting baseline at t=0 so any seek before 4.0s renders the
         read state, rather than inheriting whichever fromTo authored last
         (GSAP applies fromTo from-values at authoring time, not at position). */
      tl.set("#f07-claim-inner", { scale: 1, filter: "blur(0px)", opacity: 1 }, 0);

      tl.fromTo("#f07-claim-inner",
        { scale: 1, filter: "blur(0px)" },
        { scale: 0.82, filter: "blur(10px)", duration: 0.34, ease: "power3.in", immediateRender: false }, 4.00);
      tl.fromTo("#f07-claim-inner",
        { opacity: 1 },
        { opacity: 0, duration: 0.34, ease: "none", immediateRender: false }, 4.00);

      /* bottom-up-letters — FOOTY REACTS assembles glyph by glyph out of the
         masks into the vacated centre. Opacity stays binary (an arrival never
         fades); travel and settle vary by weight, gaps overlap into a wave. */
      var glyphs = document.querySelectorAll("#f07-mark .f07-g > i");
      var TRAVEL = [122, 108, 108, 112, 118, 110, 106, 106, 112, 110, 120];
      var DUR = [0.34, 0.28, 0.28, 0.29, 0.30, 0.30, 0.27, 0.27, 0.29, 0.28, 0.33];
      var MARK_T0 = 4.35;
      for (var g = 0; g < glyphs.length; g++) {
        tl.fromTo(glyphs[g],
          { yPercent: TRAVEL[g] },
          { yPercent: 0, duration: DUR[g], ease: "power4.out" },
          MARK_T0 + g * 0.055);
      }

      /* the URL fades up beneath the wordmark */
      tl.fromTo("#f07-url",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.60, ease: "power3.out" }, 5.05);

      /* ------------------------------------------------------------------
         Scene 4 (6.2–9.0s) — nothing. The last tween ends at 5.65 and the
         lockup is dead still to the final frame: no jitter, no breathe, no
         trailing motion, and no exit. It stops cleanly.
      ------------------------------------------------------------------ */

      window.__timelines["07-every-view-counts"] = tl;
      tl.seek(0);
    })();
  </script>
