<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var root = document.getElementById("root");
  var tl = gsap.timeline({ paused: true });

  var n = function (el, k) {
    var v = parseFloat(el.dataset[k]);
    return isNaN(v) ? 0 : v;
  };

  /* dynamic-content-sequencing: the flat TIMELINE is reduced ONCE, here at
     build time, never inside an onUpdate. Accelerating cadence comes from a
     geometric decay on the hold, clamped at a flurry floor - so the density
     ramp speeds up on its own, with no speed-up tween anywhere. */
  function sequence(items, start, holdStart, decay, floor) {
    var cum = start;
    return items.map(function (item, i) {
      var hold = Math.max(floor, holdStart * Math.pow(decay, i));
      var at = cum;
      cum += hold;
      return { el: item, at: at };
    });
  }

  var PUSH_AT = 7.62;           // Scene 5 cue - "a hundred takes start"
  var PUSH_DUR = 2.38;          // runs out exactly on the 10s cut...
  var PUSH_EASE = "power2.in";  // ...at peak velocity, so nothing resolves

  /* A foreground card: arrives at its approved sketch position, keeps creeping
     inward while the others land, then is swept by the lockstep close-in.
     Rotation is a GSAP prop, never a CSS transform (they would fight). */
  function arrive(el, at, dur) {
    var rot = n(el, "rot");
    var px = n(el, "px");
    var py = n(el, "py");

    tl.fromTo(
      el,
      { x: n(el, "ex"), y: n(el, "ey"), rotation: rot * 2.4, scale: 0.88, opacity: 0 },
      { x: 0, y: 0, rotation: rot, scale: 1, opacity: 1, duration: dur, ease: "power3.out" },
      at
    );

    // density ramp - the ring keeps tightening between arrivals; nothing freezes
    var creepAt = at + dur;
    var creepDur = PUSH_AT - creepAt;
    if (creepDur > 0.05) {
      tl.to(
        el,
        { x: px * 0.3, y: py * 0.3, rotation: rot * 1.15, duration: creepDur, ease: "none" },
        creepAt
      );
    }

    /* center-outward-expansion, run INWARD, synced-chord variant: every card
       shares one start, one duration and one ease, travelling its own baked
       data-px/data-py vector toward centre - one beat, not a stagger. */
    tl.to(
      el,
      { x: px, y: py, rotation: rot * 1.9, scale: 1.045, duration: PUSH_DUR, ease: PUSH_EASE },
      PUSH_AT
    );
  }

  // A far-field card: blurred depth held at ~30%, joining the same chord weaker.
  function deepen(el, at) {
    var rot = n(el, "rot");
    var px = n(el, "px");
    var py = n(el, "py");

    tl.fromTo(
      el,
      { x: px * -0.55, y: py * -0.55, rotation: rot * 1.8, scale: 0.9, opacity: 0 },
      { x: 0, y: 0, rotation: rot, scale: 1, opacity: 0.3, duration: 0.5, ease: "power3.out" },
      at
    );

    // Group A lands before PUSH_AT and rides the chord exactly; the late
    // thickeners start squeezing the moment they land, still ending on the cut.
    var from = Math.max(PUSH_AT, at + 0.5);
    tl.to(
      el,
      { x: px, y: py, rotation: rot * 1.5, scale: 1.05, duration: 10 - from, ease: PUSH_EASE },
      from
    );
  }

  var united = root.querySelector("#flood-c-united");
  var stretford = root.querySelector("#flood-c-stretford");
  var kombo = root.querySelector("#flood-c-kombo");
  var adikas = root.querySelector("#flood-c-adikas");
  var tribe = root.querySelector("#flood-c-tribe");
  var toffee = root.querySelector("#flood-c-toffee");
  var nest = root.querySelector("#flood-c-nest");

  var deep = Array.prototype.slice.call(root.querySelectorAll(".flood-dim"));
  var deepA = deep.slice(0, 8);
  var deepB = deep.slice(8);

  // Scene 1 (0.0-1.8s) - bare cream; one card in from the left edge.
  arrive(united, 0.08, 0.65);

  // Scene 2 (1.8-3.4s) - in from the right; the first card does not re-animate.
  arrive(stretford, 1.85, 0.62);

  // Scene 3 (3.4-5.0s) - the single red card, up from below.
  arrive(kombo, 3.45, 0.62);

  // Scene 4 (5.0-7.6s) - the remaining four accelerate inward from four
  // different edges in quick succession; the far layer populates behind them.
  sequence([adikas, tribe, toffee, nest], 5.05, 0.52, 0.8, 0.3).forEach(function (step) {
    arrive(step.el, step.at, 0.55);
  });

  sequence(deepA, 5.22, 0.4, 0.82, 0.16).forEach(function (step) {
    deepen(step.el, step.at);
  });

  // Scene 5 (7.6-10.0s) - the whole field closes in lockstep (fired at PUSH_AT
  // above) while the far layer keeps thickening right into the cut.
  sequence(deepB, 7.7, 0.34, 0.82, 0.14).forEach(function (step) {
    deepen(step.el, step.at);
  });

  window.__timelines = window.__timelines || {};
  window.__timelines["02-the-flood"] = tl;
  tl.seek(0);
})();
</script>
