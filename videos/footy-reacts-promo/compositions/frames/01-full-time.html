  <script>
    (function () {
      var ROOT = document.querySelector('[data-composition-id="01-full-time"]');
      var teamsEl = ROOT.querySelector('#f01-teams');
      var kickEl = ROOT.querySelector('#f01-kick');
      var kickTextEl = ROOT.querySelector('#f01-kick-text');
      var rulePaths = ROOT.querySelectorAll('.f01-rule path');

      var tl = gsap.timeline({ paused: true });

      /* ------------------------------------------------------------------
       * Scene 1 (0.0-1.4s) - nothing enters. The scoreline and the wallpaper
       * "90" are already seated at t=0. The single restrained move of the
       * entire frame: the coral rule draws OUTWARD FROM CENTRE beneath the
       * scoreline (svg-path-draw - measured getTotalLength dasharray +
       * dashoffset; both halves run together so the growth reads symmetric).
       * ---------------------------------------------------------------- */
      for (var i = 0; i < rulePaths.length; i++) {
        var p = rulePaths[i];
        var len = p.getTotalLength ? p.getTotalLength() : 170;
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      }
      tl.to(rulePaths, {
        strokeDashoffset: 0,
        duration: 0.85,
        ease: 'power2.out' /* a pen lifting at the end of the stroke */
      }, 0.35);

      /* ------------------------------------------------------------------
       * Scene 2 (1.4-2.6s) - on the spoken "Full time.", the mono kicker
       * resolves under the rule (discrete-text-sequence: sparse {t,text}
       * states reverse-searched every frame, instant jumps between them)
       * while it fades up. The scoreline does not react.
       * ---------------------------------------------------------------- */
      var SEQUENCE = [
        { t: 0.00, text: '' },
        { t: 1.40, text: '16:30' },
        { t: 1.58, text: '16:30 ·' },
        { t: 1.80, text: '16:30 · FULL' },
        { t: 2.06, text: '16:30 · FULL TIME' }
      ];
      function textAt(time) {
        for (var k = SEQUENCE.length - 1; k >= 0; k--) {
          if (time >= SEQUENCE[k].t) return SEQUENCE[k].text;
        }
        return '';
      }
      var driver = { t: 0 };
      tl.to(driver, {
        t: 6,
        duration: 6,
        ease: 'none',
        onUpdate: function () { kickTextEl.textContent = textAt(driver.t); }
      }, 0);

      tl.fromTo(kickEl,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power1.out' },
        1.40);

      /* ------------------------------------------------------------------
       * Scene 3 (2.6-6.0s) - the held read. No camera, no drift, no
       * breathing: the over-long hold IS this frame's payload and is
       * deliberately not filled. The only life is sine-wave-loop at the very
       * bottom of its register (1.2px, ~3s period) on the scoreline, with
       * the settle-and-fade envelope ramping amplitude to zero so the frame
       * is exactly static at the cut - honouring handoff_out (scoreline
       * group: x 50%, y 47%, scale 1.0, opacity 1.0, motion 0 px/s).
       * ---------------------------------------------------------------- */
      var IDLE_START = 2.70;
      var IDLE_DUR = 3.30;
      var CYCLES = 1.1;
      var Y_AMP = 1.2;
      var FADE_FRAC = 0.35;
      var phase = { p: 0 };
      tl.to(phase, {
        p: Math.PI * 2 * CYCLES,
        duration: IDLE_DUR,
        ease: 'none', /* sine itself is the curve */
        onUpdate: function () {
          var t = phase.p / (Math.PI * 2 * CYCLES);
          var env = t < 1 - FADE_FRAC ? 1 : Math.max(0, (1 - t) / FADE_FRAC);
          teamsEl.style.transform =
            'translateY(' + (Math.sin(phase.p) * Y_AMP * env).toFixed(3) + 'px)';
        }
      }, IDLE_START);

      /* No exit tween - the root transition owns the cut out of this frame. */

      window.__timelines = window.__timelines || {};
      window.__timelines['01-full-time'] = tl;
      tl.seek(0);
    })();
